name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository
    - uses: actions/checkout@v4

    # Step 2: Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"  # Specify the Python version you want to use
        cache: "pip"  # Enable pip caching

    # Step 3: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --only-binary=:all: -r requirements.txt

    # Step 4: Run Pytest with secrets
    - name: Run Pytest
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        PYTHONPATH: ${{ github.workspace }}
        VISUALCROSSING_API_KEY: ${{ secrets.VISUALCROSSING_API_KEY }}
        LOCATION_LATITUDE: ${{ secrets.LOCATION_LATITUDE }}
        LOCATION_LONGITUDE: ${{ secrets.LOCATION_LONGITUDE }}
        METEOBLUE_API_KEY: ${{ secrets.METEOBLUE_API_KEY }}
        METEOMATICS_USERNAME: ${{ secrets.METEOMATICS_USERNAME }}
        METEOMATICS_PASSWORD: ${{ secrets.METEOMATICS_PASSWORD }}
        METEOSOURCE_API_KEY: ${{ secrets.METEOSOURCE_API_KEY }}
        WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
      run: pytest tests/
